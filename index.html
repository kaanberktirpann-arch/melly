<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Melly">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Melly</title>
<!-- Melly - Velayet dosya takip uygulamasi -->
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--line:#e4e2dc;--line2:#cfccc4;--tx:#1f1e1b;--tx2:#6b6960;--tx3:#9a978e;
  --acc:#7a4fd6;--accbg:#efe9fc;--acctx:#4b2c96;
  --red:#c93434;--redbg:#fcebeb;--redtx:#8f2020;
  --red2bg:#c93434;--red2tx:#ffffff;
  --yel:#b7791a;--yelbg:#fbf1dc;--yeltx:#7a4d07;
  --grn:#3d7a16;--grnbg:#eaf3de;--grntx:#2b560c;
  --gry:#efede8;--grytx:#5f5e5a;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161614;--card:#21211e;--line:#34332f;--line2:#4a4944;--tx:#f1efe8;--tx2:#b4b2a9;--tx3:#87857d;
  --acc:#a48cf0;--accbg:#2e2548;--acctx:#d5c9fa;
  --red:#f09595;--redbg:#4a1c1c;--redtx:#f7c1c1;
  --red2bg:#d84545;--red2tx:#ffffff;
  --yel:#efa94a;--yelbg:#45320f;--yeltx:#fac775;
  --grn:#97c459;--grnbg:#22330f;--grntx:#c0dd97;
  --gry:#2c2c29;--grytx:#c9c7be;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header h1{font-size:22px;margin:0;font-weight:600;letter-spacing:.2px}
header h1 span{color:var(--acc)}
main{padding:12px 14px;max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--tx3);font-size:11px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 4px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:600}
.stat small{font-size:11px;color:var(--tx2)}
.stat.r{background:var(--redbg);border-color:transparent;color:var(--redtx)}
.stat.r small{color:var(--redtx)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line2);background:var(--card);color:var(--tx2);border-radius:20px;padding:5px 12px;font-size:13px;font-family:inherit}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.file{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-bottom:8px;cursor:pointer}
.file.lv-cokacil,.file.lv-gecti{border:2px solid var(--red)}
.file.lv-kirmizi{border-color:var(--red)}
.file.lv-sari{border-color:var(--yel)}
.ftop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ftop b{font-size:16px;font-weight:600}
.kalan{font-size:14px;font-weight:600;white-space:nowrap}
.sub{font-size:13px;color:var(--tx2)}
.bd{display:inline-block;font-size:12px;padding:2px 8px;border-radius:7px;margin:4px 4px 0 0;background:var(--gry);color:var(--grytx)}
.bd.r{background:var(--redbg);color:var(--redtx)}
.bd.rr{background:var(--red2bg);color:var(--red2tx)}
.bd.y{background:var(--yelbg);color:var(--yeltx)}
.bd.g{background:var(--grnbg);color:var(--grntx)}
.bd.a{background:var(--accbg);color:var(--acctx)}
.c-cokacil,.c-gecti,.c-kirmizi{color:var(--red)}
.c-sari{color:var(--yel)}
.c-yesil{color:var(--grn)}
.c-yok{color:var(--tx3)}
button.btn{font-family:inherit;font-size:15px;border-radius:10px;padding:10px 14px;border:1px solid var(--line2);background:var(--card);color:var(--tx);cursor:pointer}
button.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.btn.d{color:var(--red);border-color:var(--red)}
button.btn.s{font-size:13px;padding:6px 10px;border-radius:8px}
button.btn.w{width:100%}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;border:0;font-size:30px;line-height:1;z-index:4;box-shadow:0 3px 10px rgba(0,0,0,.25)}
label.f{display:block;font-size:13px;color:var(--tx2);margin:10px 0 4px}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:9px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--card);color:var(--tx)}
input[type=checkbox]{width:auto;transform:scale(1.25);margin-right:8px}
textarea{min-height:80px;resize:vertical}
.err{color:var(--red);font-size:13px;margin-top:4px}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(30px + env(safe-area-inset-bottom))}
.sheet .sh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);z-index:2}
.sheet .sh h2{font-size:18px;margin:0;font-weight:600}
.sheet .sb{padding:12px 14px;max-width:640px;margin:0 auto}
.x{background:none;border:0;color:var(--tx);font-size:28px;line-height:1;padding:0 4px;font-family:inherit}
h3{font-size:15px;margin:16px 0 6px;font-weight:600}
.kv{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.kv span:first-child{color:var(--tx2)}
.log{font-size:13px;color:var(--tx2);border-left:2px solid var(--line2);padding-left:10px}
.log div{margin-bottom:4px}
.days{display:flex;gap:5px;margin:10px 0}
.day{flex:1;text-align:center;border:1px solid var(--line2);border-radius:9px;padding:5px 0;font-size:13px;background:var(--card);color:var(--tx);font-family:inherit}
.day small{display:block;font-size:11px;color:var(--tx2)}
.day.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.day.on small{color:var(--bg)}
.day.off{opacity:.4}
.slot{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:6px;background:var(--card);font-size:15px;width:100%;font-family:inherit;color:var(--tx);text-align:left}
.slot.free{border-color:var(--acc);cursor:pointer}
.slot.free span:last-child{color:var(--acc);font-weight:600}
.slot.busy{color:var(--tx3)}
.ogle{text-align:center;font-size:12px;color:var(--tx3);padding:2px 0 8px}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px;background:var(--yelbg);color:var(--yeltx)}
.banner.r{background:var(--redbg);color:var(--redtx)}
.banner.a{background:var(--accbg);color:var(--acctx)}
.banner button{margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:50;max-width:90%;text-align:center}
.dlg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg .in{background:var(--card);border-radius:14px;padding:18px;max-width:380px;width:100%}
.dlg p{margin:0 0 14px}
.empty{text-align:center;color:var(--tx2);padding:30px 10px}
.foot{text-align:center;font-size:12px;color:var(--tx3);margin:18px 0 6px}
.calday{margin-bottom:12px}
.calday h4{margin:0 0 5px;font-size:14px;font-weight:600}
.calday h4.today{color:var(--acc)}
.appt{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:5px;cursor:pointer}
.appt b{font-size:15px;min-width:46px}
.bar{height:8px;border-radius:4px;background:var(--gry);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--acc)}
a{color:var(--acc)}
.sr{position:absolute;left:-9999px}
.adm{font-size:13px;color:var(--tx2);font-weight:600;margin-top:1px}
#kilit{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
#kilit h1{font-size:30px;margin:0 0 6px;font-weight:600}
#kilit h1 span{color:var(--acc)}
.noktalar{display:flex;gap:16px;margin:22px 0 10px}
.noktalar i{width:15px;height:15px;border-radius:50%;border:2px solid var(--tx2);display:block}
.noktalar i.d{background:var(--tx);border-color:var(--tx)}
.tus{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:16px}
.tus button{width:76px;height:76px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--tx);font-size:28px;font-family:inherit}
.tus button.bos{visibility:hidden}
.tus button.sil{font-size:16px;border:0;background:none}
.salla{animation:salla .35s}
@keyframes salla{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
</style>
</head>
<body>
<header><h1>Mel<span>ly</span></h1><span class="sub" id="hdrSub"></span></header>
<main id="main"></main>
<button class="fab" id="fab" onclick="openEdit()" aria-label="Yeni dosya">+</button>
<nav id="nav">
  <button data-t="dosyalar" onclick="go('dosyalar')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Dosyalar</button>
  <button data-t="takvim" onclick="go('takvim')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/></svg>Takvim</button>
  <button data-t="ozet" onclick="go('ozet')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>Özet</button>
  <button data-t="ayarlar" onclick="go('ayarlar')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ayarlar</button>
</nav>
<div id="layer"></div>
<div id="kilit" style="display:none"></div>

<script>
"use strict";
const VERSION = "0.7";
const KEY = "melly_veri_v1";

const DURUMLAR = ["Yeni geldi","Taraflara ulaşılıyor","Randevu verildi","Görüşmeler sürüyor","Tebligat bekleniyor","Kurumdan belge bekleniyor","Rapor yazılıyor","Rapor yüklendi"];
const TARAF_DURUM = ["Ulaşılmadı","Ulaşılamıyor","Randevu verildi","Görüşüldü","Tebligat çıkarıldı","Gelmedi"];
const SAATLER = [9,10,11,13,14,15,16];
const GUN = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const GUNK = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

const TATIL_VARSAYILAN = [
"2026-01-01 Yılbaşı","2026-03-19 yarım Ramazan Bayramı arifesi","2026-03-20 Ramazan Bayramı","2026-03-21 Ramazan Bayramı","2026-03-22 Ramazan Bayramı",
"2026-04-23 Ulusal Egemenlik ve Çocuk Bayramı","2026-05-01 Emek ve Dayanışma Günü","2026-05-19 Gençlik ve Spor Bayramı",
"2026-05-26 yarım Kurban Bayramı arifesi","2026-05-27 Kurban Bayramı","2026-05-28 Kurban Bayramı","2026-05-29 Kurban Bayramı","2026-05-30 Kurban Bayramı",
"2026-07-15 Demokrasi ve Milli Birlik Günü","2026-08-30 Zafer Bayramı","2026-10-28 yarım Cumhuriyet Bayramı arifesi","2026-10-29 Cumhuriyet Bayramı",
"2027-01-01 Yılbaşı","2027-03-08 yarım Ramazan Bayramı arifesi (kontrol edin)","2027-03-09 Ramazan Bayramı (kontrol edin)","2027-03-10 Ramazan Bayramı (kontrol edin)","2027-03-11 Ramazan Bayramı (kontrol edin)",
"2027-04-23 Ulusal Egemenlik ve Çocuk Bayramı","2027-05-01 Emek ve Dayanışma Günü","2027-05-15 yarım Kurban Bayramı arifesi (kontrol edin)","2027-05-16 Kurban Bayramı (kontrol edin)","2027-05-17 Kurban Bayramı (kontrol edin)","2027-05-18 Kurban Bayramı (kontrol edin)","2027-05-19 Kurban Bayramı / Gençlik ve Spor Bayramı",
"2027-07-15 Demokrasi ve Milli Birlik Günü","2027-08-30 Zafer Bayramı","2027-10-28 yarım Cumhuriyet Bayramı arifesi","2027-10-29 Cumhuriyet Bayramı"
].join("\n");

const SABLONLAR = [
 {id:"randevu", ad:"Randevu bilgilendirme (tarafa)", kime:"taraf",
  metin:"Sayın {ad},\n{mahkeme} {esasNo} esas sayılı dosya kapsamında sosyal inceleme görüşmeniz planlanmıştır.\n\nTarih: {tarih} {gun}\nSaat: {saat}\nYer: {adres}\n\nLütfen kimliğinizle birlikte geliniz. Çocuk(lar)ınızın da görüşmeye katılması gerekmektedir.\n\n{unvan}"},
 {id:"davet", ad:"Görüşmeye davet / ulaşılamayan taraf", kime:"taraf",
  metin:"Sayın {ad},\n{mahkeme} {esasNo} esas sayılı dosya kapsamında sosyal inceleme raporu hazırlanabilmesi için sizinle görüşme yapılması gerekmektedir.\n\nRandevu oluşturmak için hafta içi 09:00-17:00 saatleri arasında {telefonum} numaralı telefondan iletişime geçmeniz rica olunur.\n\n{unvan}"},
 {id:"kurum", ad:"Kurumdan belge talebi", kime:"kurum",
  metin:"{kurum}\n\n{mahkeme} {esasNo} esas sayılı dosyası kapsamında hazırlanmakta olan sosyal inceleme raporunda değerlendirilmek üzere, ilgili kişiye ait kayıt ve belgelerin tarafıma gönderilmesini rica ederim.\n\n{bugun}\n{unvan}"},
 {id:"bilgi", ad:"Mahkemeye bilgi notu (tebligat bekleniyor)", kime:"taraf",
  metin:"{mahkeme} {esasNo} esas sayılı dosya kapsamında taraflardan {ad} ile telefon yoluyla iletişim kurulamadığından {tebligat} tarihinde tebligat çıkarılmış olup tebligat dönüşü beklenmektedir. Görüşme gerçekleştirildikten sonra sosyal inceleme raporu dosyaya sunulacaktır.\n\n{bugun}\n{unvan}"}
];

let storageOk = true;
let S = load();
let tab = "dosyalar", filtre = "tumu", arama = "", calOfs = 0, ozetAy = null;

function bosVeri(){ return {v:1, files:[], ayar:{unvan:"", adres:"", telefonum:"", takipGun:15, tatiller:TATIL_VARSAYILAN, sablonlar:{}, pinH:""}, sonYedek:null}; }
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    localStorage.setItem(KEY+"_test","1"); localStorage.removeItem(KEY+"_test");
    if(raw){ const d = JSON.parse(raw); const b = bosVeri(); d.ayar = Object.assign(b.ayar, d.ayar||{}); return donustur(d); }
  }catch(e){ storageOk = false; }
  return bosVeri();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ storageOk = false; } }

/* ---------- tarih yardımcıları ---------- */
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function bugun(){ return ymd(new Date()); }
function pd(s){ const a = s.split("-").map(Number); return new Date(a[0],a[1]-1,a[2]); }
function ekle(s,n){ const d = pd(s); d.setDate(d.getDate()+n); return ymd(d); }
function fark(a,b){ return Math.round((pd(b)-pd(a))/86400000); }
function tf(s){ if(!s) return "-"; const a = s.split("-"); return a[2]+"."+a[1]+"."+a[0]; }
function gunAd(s){ return GUN[pd(s).getDay()]; }
function saatStr(h){ return String(h).padStart(2,"0")+":00"; }
function simdi(){ const d = new Date(); return ymd(d)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function etk(p){ return p.rol||""; }
function donustur(d){
  (d.files||[]).forEach(f=>(f.taraflar||[]).forEach(p=>{
    if(p.rol==="Anne"){ p.rol = "Davacı"; p.kim = "Anne"; }
    else if(p.rol==="Baba"){ p.rol = "Davalı"; p.kim = "Baba"; }
  }));
  return d;
}
function haftaBasi(s){ const d = pd(s); const g = (d.getDay()+6)%7; d.setDate(d.getDate()-g); return ymd(d); }

function tatilMap(){
  const m = {};
  (S.ayar.tatiller||"").split("\n").forEach(l=>{
    const t = l.trim(); const mm = t.match(/^(\d{4}-\d{2}-\d{2})\s*(.*)$/); if(!mm) return;
    const yarim = /^yar[ıi]m/i.test(mm[2]);
    m[mm[1]] = {yarim, ad: mm[2].replace(/^yar[ıi]m\s*/i,"") || "Tatil"};
  });
  return m;
}
function gunSaatleri(s){
  const g = pd(s).getDay(); if(g===0||g===6) return {saatler:[], neden:"Hafta sonu"};
  const t = tatilMap()[s];
  if(t && !t.yarim) return {saatler:[], neden:t.ad};
  if(t && t.yarim) return {saatler:SAATLER.filter(h=>h<12), neden:t.ad+" (öğleden sonra kapalı)"};
  return {saatler:SAATLER.slice(), neden:""};
}

/* ---------- hesaplar ---------- */
function hedef(f){
  if(f.yuklendi) return null;
  const t = bugun();
  const d7 = f.durusma ? ekle(f.durusma,-7) : null;
  if(f.istem && f.istem >= t){
    if(d7 && d7 < f.istem) return seviye({tarih:d7, tur:"kesin", istemGecti:false});
    return seviye({tarih:f.istem, tur:"istem", istemGecti:false});
  }
  if(d7) return seviye({tarih:d7, tur:"kesin", istemGecti:!!f.istem});
  if(f.istem) return seviye({tarih:f.istem, tur:"istem", istemGecti:true, durusmaYok:true});
  return null;
}
function seviye(h){
  h.kalan = fark(bugun(), h.tarih);
  if(h.kalan < 0) h.lv = "gecti";
  else if(h.tur==="kesin" && h.kalan <= 10) h.lv = "cokacil";
  else if(h.istemGecti) h.lv = "kirmizi";
  else if(h.kalan <= 3) h.lv = "kirmizi";
  else if(h.kalan <= 7) h.lv = "sari";
  else h.lv = "yesil";
  return h;
}
const LV_SIRA = {gecti:0, cokacil:1, kirmizi:2, sari:3, yesil:4};
function kalanYazi(h){
  if(!h) return "";
  if(h.kalan < 0) return Math.abs(h.kalan)+" gün geçti";
  if(h.kalan === 0) return "Bugün";
  return h.kalan+" gün";
}
function hedefAciklama(h){
  if(!h) return "";
  if(h.durusmaYok) return "İstem "+tf(h.tarih)+" geçti, duruşma tarihi girin";
  if(h.tur==="kesin") return "Kesin sınır "+tf(h.tarih)+" (duruşma - 7 gün)";
  return "İstem "+tf(h.tarih);
}
function takipler(f){
  if(f.yuklendi) return [];
  const g = Number(S.ayar.takipGun)||15, t = bugun(), out = [];
  (f.taraflar||[]).forEach((p,i)=>{
    if(p.durum==="Tebligat çıkarıldı" && p.tebligat){
      const ref = p.takip && p.takip > p.tebligat ? p.takip : p.tebligat;
      const gun = fark(ref,t); if(gun >= g) out.push({tip:"taraf", i, gun, yazi:etk(p)+" tebligatı "+fark(p.tebligat,t)+" gün oldu"});
    }
  });
  (f.belgeler||[]).forEach((b,i)=>{
    if(!b.geldi && b.talep){
      const ref = b.takip && b.takip > b.talep ? b.takip : b.talep;
      const gun = fark(ref,t); if(gun >= g) out.push({tip:"belge", i, gun, yazi:b.kurum+" belgesi "+fark(b.talep,t)+" gün oldu"});
    }
  });
  return out;
}
function tumRandevular(){
  const out = [];
  S.files.forEach(f=>(f.taraflar||[]).forEach((p,i)=>{ if(p.randevu) out.push({f, p, i, tarih:p.randevu.tarih, saat:p.randevu.saat}); }));
  const k = r=>r.tarih+String(r.saat).padStart(2,"0");
  return out.sort((a,b)=> k(a).localeCompare(k(b)) );
}
function doluMu(tarih, saat){ return tumRandevular().find(r=>r.tarih===tarih && r.saat===saat); }

/* ---------- genel yardımcılar ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function bul(id){ return S.files.find(f=>f.id===id); }
function logla(f,m){ (f.gecmis=f.gecmis||[]).unshift({t:simdi(), m}); }
function toast(m){ const d = document.createElement("div"); d.className="toast"; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
function sor(mesaj, evetYazi, evet, tehlike){

function sheet(baslik, html, id){

}
function kapatSheet(id){
  const e = document.getElementById(id||"sheet"); if(e) e.remove();

/* ---------- ekranlar ---------- */
function go(t){ tab = t; render(); window.scrollTo(0,0); }
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.t===tab));
  document.getElementById("fab").style.display = tab==="dosyalar" ? "" : "none";

}

function bannerlar(){
  let h = "";
  if(!storageOk) h += '<div class="banner r">Bu ekranda bilgiler kalıcı olarak kaydedilemiyor (deneme modu). Sayfa kapanınca girdikleriniz silinebilir.</div>';
  if(S.files.length && storageOk){
    const gun = S.sonYedek ? fark(S.sonYedek.slice(0,10), bugun()) : null;
    if(gun===null || gun >= 7) h += '<div class="banner a">'+(gun===null?"Henüz hiç yedek almadınız.":"Son yedeğin üzerinden "+gun+" gün geçti.")+' Telefon kaybolursa bilgiler yedekten geri yüklenir.<br><button class="btn s" onclick="yedekAl()">Şimdi yedek al</button></div>';
  }
  return h;
}

function vDosyalar(){
  const acik = S.files.filter(f=>!f.yuklendi);
  const acil = acik.filter(f=>{ const h = hedef(f); return h && LV_SIRA[h.lv] <= 2; });
  const tk = acik.filter(f=>takipler(f).length);
  const hb = bugun(), hs = ekle(hb,6);
  const hr = tumRandevular().filter(r=>r.tarih>=hb && r.tarih<=hs && !r.f.yuklendi);
  let h = bannerlar();
  if(!S.files.length){
    return h + '<div class="card empty"><p style="font-size:18px;color:var(--tx);margin-top:0">Melly\'ye hoş geldin</p><p>Mahkemeden gelen dosyaları ekle; istem ve duruşma tarihlerini, randevuları, tebligat ve belge beklemelerini buradan takip et.</p><button class="btn p w" onclick="openEdit()">İlk dosyayı ekle</button><div style="height:8px"></div><button class="btn w" onclick="ornekYukle()">Örnek verilerle dene</button></div>' + foot();
  }
  h += '<div class="stats"><div class="stat"><b>'+acik.length+'</b><small>Açık</small></div><div class="stat '+(acil.length?'r':'')+'"><b>'+acil.length+'</b><small>Acil</small></div><div class="stat"><b>'+tk.length+'</b><small>Takip et</small></div><div class="stat"><b>'+hr.length+'</b><small>7 gün randevu</small></div></div>';
  const F = [["tumu","Tümü"],["acil","Acil"],["takip","Takip et"],["bekleyen","Bekleyenler"],["arsiv","Yüklenenler"]];
  h += '<input type="search" placeholder="Esas no, ADM no veya isim ara" value="'+esc(arama)+'" oninput="arama=this.value;listeYenile()" style="margin-bottom:8px">';
  h += '<div class="chips">'+F.map(x=>'<button class="chip '+(filtre===x[0]?'on':'')+'" onclick="filtre=\''+x[0]+'\';render()">'+x[1]+'</button>').join("")+'</div>';
  h += '<div id="liste">'+liste()+'</div>';
  return h + foot();
}
function listeYenile(){ const e = document.getElementById("liste"); if(e) e.innerHTML = liste(); }
function liste(){
  let L = S.files.slice();
  const q = arama.trim().toLocaleLowerCase("tr");
  if(q) L = L.filter(f=> (f.esasNo+" "+(f.adm||"")+" "+f.mahkeme+" "+(f.taraflar||[]).map(p=>p.ad).join(" ")).toLocaleLowerCase("tr").includes(q));
  if(filtre==="arsiv") L = L.filter(f=>f.yuklendi).sort((a,b)=>b.yuklendi.localeCompare(a.yuklendi));
  else {
    L = L.filter(f=>!f.yuklendi);
    if(filtre==="acil") L = L.filter(f=>{ const h = hedef(f); return h && LV_SIRA[h.lv] <= 2; });
    if(filtre==="takip") L = L.filter(f=>takipler(f).length);
    if(filtre==="bekleyen") L = L.filter(f=>f.durum==="Tebligat bekleniyor"||f.durum==="Kurumdan belge bekleniyor"||(f.taraflar||[]).some(p=>p.durum==="Tebligat çıkarıldı")||(f.belgeler||[]).some(b=>!b.geldi));
    L.sort((a,b)=>{ const ha = hedef(a), hb = hedef(b);
      const sa = ha?LV_SIRA[ha.lv]:9, sb = hb?LV_SIRA[hb.lv]:9;
      if(sa!==sb) return sa-sb; return (ha?ha.tarih:"9").localeCompare(hb?hb.tarih:"9"); });
  }
  if(!L.length) return '<div class="empty">Bu listede dosya yok.</div>';
  return L.map(kart).join("");
}
function kart(f){
  const h = hedef(f), tk = takipler(f);
  let b = '<span class="bd '+(f.durum==="Rapor yüklendi"?'g':'a')+'">'+esc(f.durum)+'</span>';
  if(h && h.lv==="cokacil") b += '<span class="bd rr">Çok acil</span>';
  if(tk.length) b += '<span class="bd r">Takip et</span>';
  if(f.yabanci) b += '<span class="bd">Tercüman'+(f.dil?': '+esc(f.dil):'')+'</span>';
  (f.taraflar||[]).forEach(p=>{ if(p.randevu && p.randevu.tarih>=bugun()) b += '<span class="bd y">'+esc(etk(p))+' '+tf(p.randevu.tarih).slice(0,5)+' '+saatStr(p.randevu.saat)+'</span>'; });
  const sag = f.yuklendi ? '<span class="kalan c-yesil">Yüklendi</span>' : (h ? '<span class="kalan c-'+h.lv+'">'+kalanYazi(h)+'</span>' : '<span class="kalan c-yok">Tarih yok</span>');
  const alt = f.yuklendi ? "Yüklendi "+tf(f.yuklendi) : (h ? hedefAciklama(h) : "İstem tarihi girilmedi");
  return '<div class="file lv-'+(h?h.lv:'yok')+'" onclick="openFile(\''+f.id+'\')"><div class="ftop"><b>'+esc(f.esasNo)+'</b>'+sag+'</div>'+(f.adm?'<div class="adm">ADM: '+esc(f.adm)+'</div>':'')+'<div class="sub">'+esc(f.mahkeme||"")+(f.mahkeme?' · ':'')+alt+'</div>'+b+'</div>';
}

function vTakvim(){
  const gb = pd(bugun()).getDay();
  const hb = ekle(haftaBasi(bugun()), (gb===0||gb===6?7:0) + calOfs*7);
  let h = '<div class="row2" style="align-items:center;margin-bottom:10px"><button class="btn s" style="flex:none" onclick="calOfs--;render()">&larr; Önceki</button><div style="text-align:center;font-weight:600">'+tf(hb).slice(0,5)+' - '+tf(ekle(hb,4))+'</div><button class="btn s" style="flex:none" onclick="calOfs++;render()">Sonraki &rarr;</button></div>';
  if(calOfs!==0) h += '<div style="text-align:center;margin-bottom:8px"><button class="btn s" onclick="calOfs=0;render()">Bu haftaya dön</button></div>';
  const R = tumRandevular();
  for(let i=0;i<5;i++){
    const g = ekle(hb,i), gs = gunSaatleri(g), rs = R.filter(r=>r.tarih===g);
    h += '<div class="calday"><h4 class="'+(g===bugun()?'today':'')+'">'+GUN[pd(g).getDay()]+' '+tf(g)+(g===bugun()?' · Bugün':'')+'</h4>';

    else {
      if(gs.neden) h += '<div class="sub" style="margin-bottom:4px">'+esc(gs.neden)+'</div>';
      if(!rs.length) h += '<div class="sub">Randevu yok · '+gs.saatler.length+' boş saat</div>';
      rs.forEach(r=>{ h += '<div class="appt" onclick="openFile(\''+r.f.id+'\')"><b>'+saatStr(r.saat)+'</b><div><div>'+esc(r.f.esasNo)+' · '+esc(etk(r.p))+'</div><div class="sub">'+esc(r.p.ad||"")+(r.p.durum==="Görüşüldü"?' · görüşüldü':'')+'</div></div></div>'; });
      const bos = gs.saatler.length - rs.length; if(rs.length && bos>0) h += '<div class="sub">'+bos+' boş saat</div>';
    }
    h += '</div>';
  }
  return bannerlar() + h + foot();
}

function vOzet(){
  const t = bugun(); if(!ozetAy) ozetAy = t.slice(0,7);
  const [y,m] = ozetAy.split("-").map(Number);
  const onceki = ymd(new Date(y,m-2,1)).slice(0,7), sonraki = ymd(new Date(y,m,1)).slice(0,7);
  const gelen = S.files.filter(f=>(f.gelis||"").slice(0,7)===ozetAy);
  const yuk = S.files.filter(f=>(f.yuklendi||"").slice(0,7)===ozetAy);
  const zamaninda = yuk.filter(f=>f.istem && f.yuklendi<=f.istem).length;
  const durusmaya = yuk.length - zamaninda;
  const acik = S.files.filter(f=>!f.yuklendi);
  const sure = yuk.filter(f=>f.gelis).map(f=>fark(f.gelis,f.yuklendi));
  const ort = sure.length ? Math.round(sure.reduce((a,b)=>a+b,0)/sure.length) : null;
  let h = '<div class="row2" style="align-items:center;margin-bottom:12px"><button class="btn s" style="flex:none" onclick="ozetAy=\''+onceki+'\';render()">&larr;</button><div style="text-align:center;font-weight:600;font-size:17px">'+AY[m-1]+' '+y+'</div><button class="btn s" style="flex:none" onclick="ozetAy=\''+sonraki+'\';render()">&rarr;</button></div>';
  h += '<div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><b>'+gelen.length+'</b><small>Gelen dosya</small></div><div class="stat"><b>'+yuk.length+'</b><small>Yüklenen rapor</small></div><div class="stat"><b>'+(ort===null?'-':ort)+'</b><small>Ort. gün</small></div></div>';
  h += '<div class="card"><div class="kv"><span>İstem tarihine yetişen</span><b>'+zamaninda+'</b></div><div class="kv"><span>Duruşma sınırına kalan</span><b>'+durusmaya+'</b></div></div>';
  h += '<h3>Şu an açık dosyalar ('+acik.length+')</h3><div class="card">';
  const say = {}; acik.forEach(f=>say[f.durum]=(say[f.durum]||0)+1);
  const mx = Math.max(1,...Object.values(say));
  DURUMLAR.filter(d=>d!=="Rapor yüklendi").forEach(d=>{ const n = say[d]||0; h += '<div style="margin-bottom:8px"><div class="kv" style="padding:0"><span>'+d+'</span><b>'+n+'</b></div><div class="bar"><i style="width:'+Math.round(n/mx*100)+'%"></i></div></div>'; });
  h += '</div>';
  const lv = {gecti:0,cokacil:0,kirmizi:0,sari:0,yesil:0}; acik.forEach(f=>{ const x = hedef(f); if(x) lv[x.lv]++; });
  h += '<div class="card"><div class="kv"><span class="c-gecti">Süresi geçen</span><b>'+lv.gecti+'</b></div><div class="kv"><span class="c-cokacil">Çok acil (kesin sınıra 10 gün)</span><b>'+lv.cokacil+'</b></div><div class="kv"><span class="c-kirmizi">Kırmızı</span><b>'+lv.kirmizi+'</b></div><div class="kv"><span class="c-sari">Sarı</span><b>'+lv.sari+'</b></div><div class="kv"><span class="c-yesil">Rahat</span><b>'+lv.yesil+'</b></div></div>';
  return h + foot();
}

/* ---------- dosya detayı ---------- */

  if(tk.length) x += '<div class="banner r"><b>Takip et:</b><br>'+tk.map(k=>esc(k.yazi)+' <button class="btn s" onclick="event.stopPropagation();takipEdildi(\''+f.id+'\',\''+k.tip+'\','+k.i+')">Takip edildi</button>').join("<br>")+'</div>';
  x += '<label class="f">Dosya durumu</label><select onchange="durumDegis(\''+f.id+'\',this.value)">'+DURUMLAR.map(d=>'<option '+(d===f.durum?'selected':'')+'>'+d+'</option>').join("")+'</select>';

  x += '<h3>Taraflar</h3>';
  (f.taraflar||[]).forEach((p,i)=>{

    } else x += '<div style="margin-top:10px"><button class="btn w" onclick="openSlot(\''+f.id+'\','+i+')">Randevu ver</button></div>';

function otoDurum(f){
  if(f.yuklendi || f.durum==="Rapor yazılıyor") return;
  const T = f.taraflar||[];
  if(T.length && T.every(p=>p.durum==="Görüşüldü")){ if((f.belgeler||[]).some(b=>!b.geldi)) yeniDurum(f,"Kurumdan belge bekleniyor"); else yeniDurum(f,"Rapor yazılıyor"); return; }
  if(T.some(p=>p.durum==="Tebligat çıkarıldı")) return yeniDurum(f,"Tebligat bekleniyor");
  if(T.some(p=>p.durum==="Görüşüldü")) return yeniDurum(f,"Görüşmeler sürüyor");
  if(T.some(p=>p.randevu)) return yeniDurum(f,"Randevu verildi");

/* ---------- yedek (şifreli) ---------- */
function b64(buf){ let s = ""; const a = new Uint8Array(buf); for(let i=0;i<a.length;i+=8192) s += String.fromCharCode.apply(null, a.subarray(i,i+8192)); return btoa(s); }
function unb64(s){ const b = atob(s); const a = new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i] = b.charCodeAt(i); return a; }
async function anahtar(sifre, tuz){
  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(sifre), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:tuz, iterations:200000, hash:"SHA-256"}, k, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function sifrele(obj, sifre){
  const tuz = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await anahtar(sifre, tuz);
  const c = await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({melly:1, tuz:b64(tuz), iv:b64(iv), veri:b64(c)});
}
async function coz(metin, sifre){
  const o = JSON.parse(metin); if(!o.melly) throw new Error("bicim");
  const k = await anahtar(sifre, unb64(o.tuz));
  const p = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(o.iv)}, k, unb64(o.veri));
  return JSON.parse(new TextDecoder().decode(p));
}
function yedekAl(){
  if(!window.crypto || !crypto.subtle){ toast("Bu tarayıcıda şifreleme desteklenmiyor"); return; }
  let x = '<div class="sub">Yedek dosyası bir şifreyle kilitlenir. Şifreyi unutursanız yedek açılamaz, bir yere not edin.</div><label class="f">Yedek şifresi (en az 6 karakter)</label><input id="ys1" type="password" autocomplete="new-password"><label class="f">Şifre tekrar</label><input id="ys2" type="password" autocomplete="new-password"><div id="yerr" class="err"></div><div style="height:12px"></div><button class="btn p w" onclick="yedekOlustur()">Yedek dosyasını oluştur</button><div id="yout"></div>';

  try{

      try{ const u = URL.createObjectURL(dosya); const l = document.createElement("a"); l.href = u; l.download = ad; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }catch(err){}

/* ---------- giriş şifresi ---------- */
function pinH(p){ let h = 0x811c9dc5; for(const c of "melly:"+p){ h ^= c.charCodeAt(0); h = Math.imul(h,16777619)>>>0; } return h.toString(16); }
let girilen = "", kilitli = false, gizlenme = 0, pinMod = "gir", ilkPin = "";
function kilitle(){
  kilitli = true; girilen = "";
  if(!S.ayar.pinH){ if(pinMod!=="kur2") pinMod = "kur1"; } else pinMod = "gir";
  const baslik = pinMod==="kur1" ? "Melly için 4 haneli bir şifre belirle" : pinMod==="kur2" ? "Şifreyi tekrar gir" : "Giriş şifresi";
  const K = document.getElementById("kilit");
  K.innerHTML = '<h1>Mel<span>ly</span></h1><div class="sub" style="text-align:center">'+baslik+'</div><div class="noktalar" id="nk"><i></i><i></i><i></i><i></i></div><div class="err" id="kerr" style="min-height:18px"></div><div class="tus">'
    + [1,2,3,4,5,6,7,8,9].map(n=>'<button onclick="pinTus(\''+n+'\')">'+n+'</button>').join("")
    + '<button class="bos" aria-hidden="true"></button><button onclick="pinTus(\'0\')">0</button><button class="sil" onclick="pinSil()">Sil</button></div>';
  K.style.display = "flex"; document.body.style.overflow = "hidden";
}
function noktalar(){ document.querySelectorAll("#nk i").forEach((e,i)=>e.classList.toggle("d", i < girilen.length)); }
function pinSil(){ girilen = girilen.slice(0,-1); noktalar(); }
function pinTus(n){
  if(girilen.length >= 4) return;
  girilen += n; noktalar(); document.getElementById("kerr").textContent = "";
  if(girilen.length === 4){
    setTimeout(()=>{
      if(pinMod==="kur1"){ ilkPin = girilen; pinMod = "kur2"; kilitle(); return; }
      if(pinMod==="kur2"){
        if(girilen !== ilkPin){ pinMod = "kur1"; ilkPin = ""; kilitle(); document.getElementById("kerr").textContent = "Şifreler aynı değil, baştan girin"; return; }
        S.ayar.pinH = pinH(girilen); save(); ilkPin = ""; pinMod = "gir"; toast("Şifre kaydedildi");
      }
      if(pinH(girilen) === S.ayar.pinH){
        kilitli = false; girilen = ""; const K = document.getElementById("kilit"); K.style.display = "none"; K.innerHTML = "";
        if(!document.querySelector(".sheet")) document.body.style.overflow = "";
      } else {
        girilen = ""; noktalar(); document.getElementById("kerr").textContent = "Şifre yanlış";
        const nk = document.getElementById("nk"); nk.classList.remove("salla"); void nk.offsetWidth; nk.classList.add("salla");
      }
    }, 120);
  }
}
document.addEventListener("keydown", e=>{ if(!kilitli) return; if(/^[0-9]$/.test(e.key)) pinTus(e.key); else if(e.key==="Backspace") pinSil(); });
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) gizlenme = Date.now();
  else if(!kilitli && gizlenme && Date.now()-gizlenme > 120000) kilitle();
});
function pinDegistir(){
  let x = '<label class="f" style="margin-top:0">Mevcut şifre</label><input id="p0" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><label class="f">Yeni şifre (4 rakam)</label><input id="p1" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><label class="f">Yeni şifre tekrar</label><input id="p2" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><div id="perr" class="err"></div><div style="height:12px"></div><button class="btn p w" onclick="pinKaydet()">Şifreyi kaydet</button>';
  sheet("Şifreyi değiştir", x, "pin");
}
function pinKaydet(){
  const a = document.getElementById("p0").value, b = document.getElementById("p1").value, c = document.getElementById("p2").value, e = document.getElementById("perr");
  if(S.ayar.pinH && pinH(a) !== S.ayar.pinH){ e.textContent = "Mevcut şifre yanlış."; return; }
  if(!/^\d{4}$/.test(b)){ e.textContent = "Yeni şifre 4 rakam olmalı."; return; }
  if(b !== c){ e.textContent = "Yeni şifreler aynı değil."; return; }
  S.ayar.pinH = pinH(b); save(); kapatSheet("pin"); toast("Şifre değiştirildi");
}
